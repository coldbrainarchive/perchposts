name: News Bot

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
        working-directory: bot
      - name: Run bot
        run: node index.js
        working-directory: bot
        env:
          BOT_KEY: ${{ secrets.BOT_KEY }}
          FORCE_RUN: 'true'
