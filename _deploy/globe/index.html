/* the website as plain tappable text, like the site link in the post scroller */
.pv-site{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c084fc;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
@keyframes pvIn{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%)}}
.pin.focus{z-index:2147483000!important}
body.focusing .ev .lb{display:none!important}
.pin.focus i{width:18px;height:18px}
body.focusing .pin.big .lb{display:none}
.sc .mt .pl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev{position:relative;width:26px;height:26px;transform:translate(-50%,-50%);cursor:pointer;pointer-events:auto;transition:opacity .25s}
.ev b{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--c);border:2px solid #0a0a0a;box-shadow:0 0 0 1.5px var(--c),0 0 16px var(--c);font-size:0}
.ev b::after{content:attr(data-n);font-size:11.5px;font-weight:900;color:#0a0a0a;line-height:1}
/* radar blip: a ring the same size as the circle, centred on it, growing outward */
.ev::before{content:"";position:absolute;inset:0;border-radius:999px;border:2px solid var(--c);opacity:0}
/* the radar blip only runs on the selected story (none in the overview) */
.ev.big::before{animation:evPulse 2.2s ease-out infinite}
@keyframes evPulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.ev .lb{position:absolute;left:50%;top:-10px;transform:translate(-50%,-100%);white-space:nowrap;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#0b0c10f0;border:1.5px solid var(--c);color:var(--ink);display:none}
.ev.big .lb{display:block}
.ev.big{width:30px;height:30px}
.ev.dim{opacity:0;pointer-events:none}
/* overview previews beside each story circle (only in the overview; overviewLabels decides which fit) */
.ev .mini{position:absolute;left:calc(100% + 7px);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;width:max-content;max-width:148px;padding:3px 8px 3px 3px;border-radius:10px;background:#0b0c10d9;border:1px solid color-mix(in srgb,var(--c) 65%,transparent);color:var(--ink);font-size:10.5px;font-weight:700;line-height:1.2;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;pointer-events:none;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ev .mini.left{left:auto;right:calc(100% + 7px)}
.ev .mini img{width:28px;height:28px;border-radius:7px;object-fit:cover;flex-shrink:0;background:#22252e}
.ev .mini span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.overview .ev:not(.back) .mini.show{opacity:1;visibility:visible;pointer-events:auto}
.ev.back{opacity:0;pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.3,1);padding:0 12px calc(env(safe-area-inset-bottom) + 12px)}
.sheet.in{transform:none}
.sh{max-width:480px;margin:0 auto;border-radius:20px;border:1px solid var(--line);background:var(--card);overflow:hidden;box-shadow:0 -10px 40px #000a}
.sh .grab{display:flex;justify-content:center;padding:8px 0 4px}
.sh .grab i{width:38px;height:4px;border-radius:9px;background:#3a3d48}
.sh img.hero{display:block;width:100%;max-height:200px;object-fit:cover;background:#22252e}
.sh .bd{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.sh .src{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.sh h2{margin:0;font-size:18px;line-height:1.3;font-weight:800}
.sh .story{font-size:12px;color:var(--mute);font-weight:600}
.sh .row{display:flex;gap:8px;margin-top:4px}
.sh .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;height:40px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:#1d2029}
.sh .btn.pri{background:var(--accent);border-color:var(--accent);color:#14081d}
/* story scroller: swipe up/down through every outlet's version of the story (like the post scroller) */
.sheet .sh{display:flex;flex-direction:column;height:min(64vh,600px);border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.rs-hd{display:flex;align-items:center;gap:8px;padding:2px 14px 10px;border-bottom:1px solid #262a35}
.rs-hd .rk{background:var(--c)}
.rs-tt{flex:1;min-width:0;font-size:12.5px;font-weight:800;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-hd b{flex-shrink:0;font-size:12px;font-weight:900;color:var(--c);letter-spacing:.03em}
.rs{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rs::-webkit-scrollbar{display:none}
.rsl{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;overflow:hidden}
.rsl img.hero{display:block;width:100%;height:38%;max-height:none;flex-shrink:0;object-fit:cover;background:#22252e}
.rsl .bd{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:12px 16px 12px}
.rsl h2{margin:0;font-size:18px;line-height:1.28;font-weight:800;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rsl .ds{margin:0;font-size:13.5px;line-height:1.45;color:#b6c2d1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.rsl .row{margin-top:auto}
.rs-hint{text-align:center;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.03em}
body.reeling .pin .pv,body.reeling .pin .lb{display:none!important}
body.reeling .pin.focus i{width:20px;height:20px;box-shadow:0 0 0 2px var(--c),0 0 22px var(--c)}
/* worm hunt */
.hunt-cv{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
body.hunting .strip,body.hunting .sheet,body.hunting .pin,body.hunting .ev,body.hunting #glLoadS{display:none!important}
.hunt-pill,.hunt-bar{position:fixed;left:50%;z-index:7;display:flex;align-items:center;border:1px solid #c084fc66;background:rgba(21,23,29,.94);color:#e2e8f0;font:inherit;box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 14px rgba(192,132,252,.25);-webkit-tap-highlight-color:transparent;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.hunt-pill{gap:7px;height:38px;padding:0 16px 0 12px;border-radius:999px;font-size:14px;font-weight:800;letter-spacing:.01em;transform:translate(-50%,8px);cursor:pointer}
.hunt-pill.in,.hunt-bar.in{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.hunt-pill:active{background:#1d2029}
.hw{display:inline-flex;width:20px;height:20px;color:#e8555c}.hw svg{width:100%;height:100%}.hf{display:inline-flex;width:20px;height:20px;color:#c084fc}.hf svg{width:100%;height:100%}
.hunt-bar{bottom:calc(env(safe-area-inset-bottom) + 16px);gap:8px;height:40px;padding:0 4px 0 12px;border-radius:999px;transform:translate(-50%,10px);max-width:calc(100vw - 32px)}
.hb-n{display:inline-flex;align-items:center;gap:6px}.hb-n b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;color:#f87171;text-shadow:0 0 8px rgba(232,85,92,.4)}
.hb-n.bump{animation:hbBump .45s cubic-bezier(.2,.9,.3,1.4)}@keyframes hbBump{40%{transform:scale(1.35)}}
.hb-t{font-size:12px;font-weight:700;color:#94a3b8;white-space:nowrap;overflow:hidden;max-width:0;opacity:0;transition:max-width .3s,opacity .3s}.hb-t.on{max-width:120px;opacity:1}
.hb-x{width:32px;height:32px;flex-shrink:0;border-radius:999px;border:0;background:#22252e;color:#cbd5e1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.hb-x svg{width:14px;height:14px}
.empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:600;font-size:14px;pointer-events:none}
</style>
