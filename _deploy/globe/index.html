<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#05060a">
<title>Trending Globe · Perch Posts</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#05060a;--card:#15171d;--line:#2a2d38;--ink:#e2e8f0;--mute:#94a3b8;--dim:#64748b;--accent:#c084fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 40%,#0d1020 0%,#05060a 70%)}
#stars{position:fixed;inset:0;pointer-events:none}
#globe{position:fixed;inset:0}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:linear-gradient(#05060ae6,#05060a00)}
.back{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:#15171dcc;color:var(--ink);text-decoration:none;flex-shrink:0}
.back svg{width:18px;height:18px}
.ttl{display:flex;flex-direction:column;min-width:0}
.ttl b{font-size:15px;font-weight:800;letter-spacing:.02em}
.ttl span{font-size:11.5px;color:var(--mute);font-weight:600}
.home{margin-left:auto;font-weight:800;font-size:15px;color:var(--accent);text-decoration:none;letter-spacing:-.01em}
.strip{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 0 calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(#05060a00,#05060af0 30%)}
.strip-in{display:flex;gap:10px;overflow-x:auto;padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip-in::-webkit-scrollbar{display:none}
/* Story cards. The selected card is bigger, with a crisp outline, and its outlet list opens inside it (the card
   grows upward from the bottom of the screen). */
.strip-in{align-items:flex-end}
.sc{flex:0 0 80%;max-width:360px;scroll-snap-align:center;display:flex;flex-direction:column;border-radius:18px;border:1px solid var(--line);background:#15171df0;color:inherit;text-align:left;font:inherit;overflow:hidden;transition:flex-basis .25s ease,max-width .25s ease,border-color .2s}
.sc.on{flex-basis:90%;max-width:440px;border:2px solid var(--c);box-shadow:0 10px 30px #000a}
.sc-top{display:flex;gap:11px;align-items:center;padding:10px;cursor:pointer}
.sc.on .sc-top{padding:12px}
.sc img,.sc .ph{width:58px;height:58px;border-radius:11px;object-fit:cover;flex-shrink:0;background:#22252e}
.sc.on img,.sc.on .ph{width:72px;height:72px;border-radius:13px}
.sc .tx{min-width:0;display:flex;flex-direction:column;gap:5px}
.sc .hd{font-size:13.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc.on .hd{font-size:14.5px;-webkit-line-clamp:3}
.sc .mt{font-size:11px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:6px;min-width:0}
.sc .mt .pl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc.on .mt .pl{white-space:normal}
.sc .mt2{display:none;font-size:11.5px;font-weight:700;color:var(--mute)}
.sc.on .mt2{display:block}
.sc.on .mt .cnt{display:none}
/* outlet list inside the selected card */
.ol{display:none;flex-direction:column;border-top:1px solid #262a35}
.sc .ol.on{display:flex}
.ol-h{display:flex;align-items:center;gap:8px;padding:8px 12px}
.ol-t{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 2px;border:0;background:none;color:var(--c);font:inherit;font-size:12.5px;font-weight:800;letter-spacing:.02em;cursor:pointer}
.ol-t i{font-style:normal;transition:transform .2s;display:inline-block}
.ol.open .ol-t i{transform:rotate(180deg)}
/* same toggle as the rest of Perch Posts (sort-toggle + sliding tg-thumb) */
.sort-toggle{position:relative;isolation:isolate;display:flex;border-radius:999px;border:1px solid #c084fc;flex-shrink:0;background:#15171d;margin-left:auto}
.sort-toggle-btn{position:relative;z-index:1;padding:0 12px;height:28px;border:none;background:transparent;color:#c084fc;font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:color .15s}
.sort-toggle-btn.active{color:#fff}
.tg-thumb{position:absolute;top:-1px;bottom:-1px;left:0;right:100%;border-radius:999px;background:#c084fc;z-index:0;pointer-events:none;transition:left .25s cubic-bezier(.3,.7,.3,1),right .25s cubic-bezier(.3,.7,.3,1)}
.sort-toggle.no-anim .tg-thumb{transition:none}
.ol:not(.open) #olS{display:none!important}
.ol-l{max-height:0;overflow:hidden auto;transition:max-height .3s ease;-webkit-overflow-scrolling:touch}
.ol.open .ol-l{max-height:46vh;border-top:1px solid #22252e}
.or{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:0;border-bottom:1px solid #22252e;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.or:last-child{border-bottom:0}
.or.on{background:color-mix(in srgb,var(--c) 14%,transparent)}
.or .fl{font-size:18px;line-height:1;flex-shrink:0}
.or .nm{display:flex;flex-direction:column;min-width:0;gap:2px}
.or .nm b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.or .nm span{font-size:11.5px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.or .fs{margin-left:auto;flex-shrink:0;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:var(--c);color:#0a0a0a}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--c);color:#0a0a0a;font-size:10.5px;font-weight:900}
.pin{transform:translate(-50%,-50%);cursor:pointer;pointer-events:auto;transition:opacity .25s}
.pin i{display:block;width:12px;height:12px;border-radius:999px;background:var(--c);border:2px solid #0a0a0a;box-shadow:0 0 0 1.5px var(--c),0 0 10px var(--c)}
.pin.dim{opacity:.22;pointer-events:none}
.pin:not(.big){opacity:0;pointer-events:none}
.pin.big i{width:16px;height:16px}
.pin .lb{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:999px;background:#0b0c10e6;border:1px solid var(--c);color:var(--ink);display:none}
.pin.big .lb{display:block}
.pin.back{opacity:0;pointer-events:none}
.pin .pv{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:230px;display:none;gap:9px;align-items:center;padding:8px;border-radius:14px;background:#15171df5;border:1.5px solid var(--c);box-shadow:0 8px 28px #000c,0 0 14px color-mix(in srgb,var(--c) 35%,transparent);cursor:pointer}
.pin .pv::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:#15171d;border-right:1.5px solid var(--c);border-bottom:1.5px solid var(--c)}
.pin .pv img{width:52px;height:52px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#22252e}
.pin .pv .pt{display:flex;flex-direction:column;gap:3px;min-width:0}
.pin .pv .pt b{font-size:12.5px;line-height:1.25;font-weight:800;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pin .pv .pt span{font-size:10.5px;font-weight:700;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin.focus .pv{display:flex;animation:pvIn .2s ease-out}
@keyframes pvIn{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%)}}
.pin.focus{z-index:2147483000!important}
body.focusing .ev .lb{display:none!important}
.pin.focus i{width:18px;height:18px}
body.focusing .pin.big .lb{display:none}
.sc .mt .pl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev{position:relative;width:26px;height:26px;transform:translate(-50%,-50%);cursor:pointer;pointer-events:auto;transition:opacity .25s}
.ev b{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--c);border:2px solid #0a0a0a;box-shadow:0 0 0 1.5px var(--c),0 0 16px var(--c);font-size:0}
.ev b::after{content:attr(data-n);font-size:11.5px;font-weight:900;color:#0a0a0a;line-height:1}
/* radar blip: a ring the same size as the circle, centred on it, growing outward */
.ev::before{content:"";position:absolute;inset:0;border-radius:999px;border:2px solid var(--c);opacity:0}
/* the radar blip only runs on the selected story (none in the overview) */
.ev.big::before{animation:evPulse 2.2s ease-out infinite}
@keyframes evPulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.ev .lb{position:absolute;left:50%;top:-10px;transform:translate(-50%,-100%);white-space:nowrap;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#0b0c10f0;border:1.5px solid var(--c);color:var(--ink);display:none}
.ev.big .lb{display:block}
.ev.big{width:30px;height:30px}
.ev.dim{opacity:0;pointer-events:none}
.ev.back{opacity:0;pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.3,1);padding:0 12px calc(env(safe-area-inset-bottom) + 12px)}
.sheet.in{transform:none}
.sh{max-width:480px;margin:0 auto;border-radius:20px;border:1px solid var(--line);background:var(--card);overflow:hidden;box-shadow:0 -10px 40px #000a}
.sh .grab{display:flex;justify-content:center;padding:8px 0 4px}
.sh .grab i{width:38px;height:4px;border-radius:9px;background:#3a3d48}
.sh img.hero{display:block;width:100%;max-height:200px;object-fit:cover;background:#22252e}
.sh .bd{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.sh .src{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.sh h2{margin:0;font-size:18px;line-height:1.3;font-weight:800}
.sh .story{font-size:12px;color:var(--mute);font-weight:600}
.sh .row{display:flex;gap:8px;margin-top:4px}
.sh .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;height:40px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:#1d2029}
.sh .btn.pri{background:var(--accent);border-color:var(--accent);color:#14081d}
.empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:600;font-size:14px;pointer-events:none}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="globe"></div>
<div class="top">
  <a class="back" href="/" aria-label="Back to Perch Posts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="ttl"><b>Trending around the world</b><span id="sub">Last 24 hours</span></div>
  <a class="home" href="/">perchposts</a>
</div>
<div class="empty" id="empty">Loading the world’s top stories…</div>
<div class="strip"><div class="ol" id="ol"><div class="ol-h"><button type="button" class="ol-t" id="olT"></button><div class="sort-toggle" id="olS" role="group" aria-label="Order"><span class="tg-thumb"></span><button type="button" class="sort-toggle-btn" data-o="near">Nearest</button><button type="button" class="sort-toggle-btn" data-o="first">First</button></div></div><div class="ol-l" id="olL"></div></div><div class="strip-in" id="strip"></div></div>
<div class="sheet" id="sheet"><div class="sh" id="sh"></div></div>
<script src="/globe/globe.gl-2.46.2.min.js"></script>
<script src="/globe/globe-page.js"></script>
</body>
</html>
